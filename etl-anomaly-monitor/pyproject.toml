[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etl-anomaly-monitor"
version = "0.1.0"
description = "A learning-first ETL pipeline with rule-based and Isolation Forest anomaly monitoring"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0,<3",
  "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.35,<2"]
dev = ["pytest>=8,<10"]

[project.scripts]
etl-monitor = "etl_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
